name: Build and Push Docker Image on prod environment manually

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag for the Docker image'
        required: true
        type: string

env:
  DOCKER_IMAGE: ghcr.io/hermann93360/tombola
  RELEASE_NAME: tombola
  CHART_DIR: .helm-chart/angular-app

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.11.3'

      - name: Configure kubeconfig
        env:
          KUBECONFIG: $HOME/.kube/config
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig


      - name: Deploy to Kubernetes using Helm
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} ${{ env.CHART_DIR }} \
            --create-namespace \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
             --set image.tag=${{ github.event.inputs.image_tag }}
